{{ $js := resources.Get (index (index hugo.Data.assets "main.js") "src" | relURL) }}
<script src="{{ $js.Permalink }}" data-no-instant></script>
{{- $jsmap := resources.Get (printf "%s.map" (index (index hugo.Data.assets "main.js") "src")) -}}
{{- $jsmap.Publish -}}

{{ if eq hugo.Environment "production" -}}
    {{ partialCached "analytics" . }}
{{ end }}

<script src="https://cdn.jsdelivr.net/npm/@docsearch/js@3"></script>
<script>
    {{/* Which track is this page on? Records are tagged "cli" or "core" by the
         crawler; everything that isn't the CLI track (core, knowledge base,
         contributing guide) searches the "core" records. */}}
    {{ $track := cond (eq (.Page.Params.track | default "core") "cli") "cli" "core" }}
    {{ $trackLatest := cond (eq $track "cli") .Site.Params.cliLatest .Site.Params.latest }}
    {{ $latestLink := cond (eq $track "cli") (printf "/cli/v%s/" .Site.Params.cliLatest) (printf "/v%s/" .Site.Params.latest) }}

    {{ $cur_ver := "" }}
    {{/* Every version folder is indexed, so always send a version facet.
         Pages without a version param (the build-time /latest and /cli/latest
         copies, the home page) fall back to the track's latest version.
         Static pages (version "0": contribute guide, knowledge base) are
         handled separately below so their own records stay searchable. */}}
    {{ if and .Page.Params.version (ne .Page.Params.version "0") }}
        {{ if eq .Page.Params.version "master" }}
            {{ $cur_ver = "0.0.0-master" }}
        {{ else }}
            {{ $cur_ver = .Page.Params.version }}
        {{ end }}
    {{ else if not .Page.Params.version }}
        {{ $cur_ver = $trackLatest }}
    {{ end }}

    const docSearchInstance = docsearch({
        container: '#docSearch',
        appId: '9UXKYX61NK',
        indexName: 'crossplane',
        apiKey: 'e07e181044d561f6a4cb7261931d980a',
        placeholder: 'Search the docs',
        searchParameters: {
            attributesToRetrieve: ['hierarchy.lvl0', 'hierarchy.lvl1', 'hierarchy.lvl2', 'hierarchy.lvl3', 'hierarchy.lvl4', 'hierarchy.lvl5', 'hierarchy.lvl6', 'content', 'type', 'url', 'version'],
            facetFilters: [['track:{{ $track }}']{{ if $cur_ver }}, ['version:{{ $cur_ver }}']{{ else }}, ['version:0', 'version:{{ $trackLatest }}']{{ end }}]
        },
        transformItems(items) {
            // Add version warning banner and badges after DOM renders
            setTimeout(() => {
                {{ if and $cur_ver .Page.Params.version (ne .Page.Params.version "master") (ne .Page.Params.version $trackLatest) }}
                // Add warning banner for old version
                const dropdown = document.querySelector('.DocSearch-Dropdown-Container');
                if (dropdown && !dropdown.hasAttribute('data-version-banner-added')) {
                    const banner = document.createElement('div');
                    banner.style.cssText = 'padding: 12px; margin: 0 0 12px 0; background: #fff3cd; color: #856404; border-left: 4px solid #ffc107; font-size: 0.875rem;';
                    banner.innerHTML = '<strong>Searching in v{{ .Page.Params.version }}</strong><br>You are viewing an older version. Results are filtered to this version only. <a href="{{ $latestLink }}" style="color: #856404; text-decoration: underline; font-weight: 600;">View v{{ $trackLatest }}</a>';
                    dropdown.insertBefore(banner, dropdown.firstChild);
                    dropdown.setAttribute('data-version-banner-added', 'true');
                }
                {{ end }}

                // Add version badges to each hit
                items.forEach(item => {
                    if (item.version && item.version !== '0') {
                        const hitLink = document.querySelector(`.DocSearch-Hit a[href="${item.url}"]`);
                        if (hitLink) {
                            const container = hitLink.querySelector('.DocSearch-Hit-Container');
                            if (container && !container.hasAttribute('data-version-set')) {
                                const versionText = item.version === '0.0.0-master' ? 'master' : `v${item.version}`;
                                const badge = document.createElement('div');
                                badge.className = 'DocSearch-Hit-version';
                                badge.textContent = versionText;
                                badge.style.cssText = 'position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 0.65rem; font-weight: 600; padding: 2px 6px; background: #5468ff; color: white; border-radius: 3px;';
                                container.style.position = 'relative';
                                container.appendChild(badge);
                                container.setAttribute('data-version-set', 'true');
                            }
                        }
                    }
                });
            }, 10);
            return items;
        }
    });

</script>
